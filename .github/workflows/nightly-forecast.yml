name: Nightly ML Batch Forecast

on:
  schedule:
    # Run every night at 02:00 UTC (past closing time, ready for morning shift)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate batch run without writing to database'
        required: false
        type: boolean
        default: false
      engine:
        description: 'Forecasting engine (legacy or gbdt)'
        required: false
        type: choice
        options:
          - legacy
          - gbdt
        default: 'legacy'

jobs:
  run-batch-forecast:
    name: Execute ML Batch Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'ML/requirements.txt'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ML/requirements.txt

      - name: Run Nightly Batch Forecasting
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ENGINE: ${{ github.event.inputs.engine || 'legacy' }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python ML/batch_forecast.py $DRY_RUN_FLAG --engine $ENGINE
