services:
  - type: web
    name: restockiq-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: STORE_TIMEZONE
        value: Asia/Kolkata
      - key: STORE_OPEN_HOUR
        value: "8.0"
      - key: STORE_CLOSE_HOUR
        value: "20.0"
      - key: COGS_RATIO
        value: "0.4"
      - key: ENGINE
        value: legacy
      - key: MONGODB_DB
        value: restockiq
      - key: ALLOWED_ORIGINS
        value: "https://restockiq.com,https://app.restockiq.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: ALLOW_DEMO_SEED
        value: "false"
